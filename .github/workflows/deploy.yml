name: Deploy Angular to Mac Mini

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 🚀 Pull and Deploy Angular Container
        shell: zsh -e {0}
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          
          # Creates the folder on the Mac Mini
          mkdir -p /Users/kalu/math-paste-web
          cd /Users/kalu/math-paste-web
          
          # Initialize git if needed
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/VINKELA/math-paste-web.git
          fi
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/VINKELA/math-paste-web.git
          
          git fetch --all
          git reset --hard origin/master
          
          # --- THE ULTIMATE KEYCHAIN BYPASS ---
          mkdir -p /Users/kalu/.docker-bypass
          echo '{"credsStore": "", "credHelpers": {}}' > /Users/kalu/.docker-bypass/config.json
          export DOCKER_CONFIG="/Users/kalu/.docker-bypass"
          
          # Connect to Colima and Build using standalone binary
          export DOCKER_HOST="unix:///Users/kalu/.colima/default/docker.sock"
          docker-compose up -d --build